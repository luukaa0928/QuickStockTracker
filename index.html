<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#000000">
    <!-- Viewport 限制使用者手勢縮放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>快速查股王</title>
    
    <!-- PWA 關鍵設定 -->
    <link rel="manifest" href="./manifest.json">

    <!-- Icon 設定 -->
    <link rel="icon" href="./icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* 禁止頁面滾動與滑動手勢 */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            touch-action: none;
        }

        body, button {
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: #000000; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding-bottom: env(safe-area-inset-bottom);
        }
        .calc { 
            width: 100%; 
            max-width: 360px; 
            background: #1e1e24; 
            border-radius: 20px; 
            padding: 20px; 
            box-shadow: 0 10px 30px rgba(255,255,255,0.05); 
        }
        .logo-container { text-align: center; margin-bottom: 12px; }
        .app-logo { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        /* 固定查詢框高度與內部行高，防止大小變動 */
        .screen { 
            background: #000; 
            border-radius: 12px; 
            padding: 15px; 
            text-align: right; 
            margin-bottom: 15px;
            height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .stock-code { color: #888; font-size: 14px; height: 20px; line-height: 20px; }
        .stock-name { color: #aaa; font-size: 15px; height: 22px; line-height: 22px; margin: 2px 0; overflow: hidden; white-space: nowrap; }
        .stock-price { font-size: 26px; font-weight: bold; height: 36px; line-height: 36px; }
        .stock-time { color: #666; font-size: 11px; height: 16px; line-height: 16px; margin-top: 2px; }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        
        /* ⚡ 核心優化：消除點擊延遲與提昇觸控效能 */
        button { 
            border: none; 
            background: #2c2c34; 
            color: #fff; 
            font-size: 18px; 
            font-weight: bold; 
            border-radius: 10px; 
            height: 52px; 
            cursor: pointer; 
            touch-action: manipulation; /* 告訴瀏覽器此按鈕無雙擊縮放，移除 300ms 延遲 */
            will-change: transform;       /* 預先啟用硬體加速 */
        }
        button:active { background: #444; }
        .btn-query { background: #007acc; }
        .up { color: #ff5252; }
        .down { color: #4caf50; }
        .text-placeholder { color: transparent !important; }
    </style>
</head>
<body>

<div class="calc">
    <div class="logo-container">
        <img src="" alt="快速查股王 Logo" class="app-logo" onerror="this.style.display='none'">
    </div>

    <div class="screen">
        <div id="codeDisplay" class="stock-code">請輸入代號</div>
        <div id="nameDisplay" class="stock-name text-placeholder">-</div>
        <div id="priceDisplay" class="stock-price text-placeholder">-</div>
        <div id="timeDisplay" class="stock-time text-placeholder">-</div>
    </div>
    
    <div class="grid">
        <button onclick="clearCode()">C</button>
        <button onclick="backspace()">⌫</button>
        <button onclick="quickSelect('t00')">大盤</button>
        <button onclick="quickSelect('2330')">2330</button>
        
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="quickSelect('0050')">0050</button>
        
        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="quickSelect('0056')">0056</button>
        
        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="quickSelect('5347')">5347</button>
        
        <button onclick="press('0')">0</button>
        <button onclick="press('00')">00</button>
        <button onclick="press('A')">A</button>
        <button class="btn-query" onclick="queryStock()">查詢</button>
    </div>
</div>

<script>
    // ⚡ 精準防手勢縮放
    document.addEventListener('touchmove', function (e) { 
        if (e.touches.length > 1) e.preventDefault(); 
    }, { passive: false });
    
    document.addEventListener('gesturestart', function (e) { 
        e.preventDefault(); 
    });

    let inputCode = "";
    let isNewInput = false;

    function press(val) {
        if (isNewInput) {
            inputCode = "";
            isNewInput = false;
        }
        inputCode += val; 
        updateCodeDisplay(); 
    }

    function clearCode() { 
        inputCode = ""; 
        isNewInput = false;
        updateCodeDisplay(); 
        
        const nameDisp = document.getElementById('nameDisplay');
        const priceDisp = document.getElementById('priceDisplay');
        const timeDisp = document.getElementById('timeDisplay');
        
        nameDisp.innerText = "-";
        nameDisp.className = "stock-name text-placeholder";
        
        priceDisp.innerText = "-";
        priceDisp.className = "stock-price text-placeholder";
        
        timeDisp.innerText = "-";
        timeDisp.className = "stock-time text-placeholder";
    }

    function backspace() { 
        if (isNewInput) {
            inputCode = "";
            isNewInput = false;
        } else {
            inputCode = inputCode.slice(0, -1); 
        }
        updateCodeDisplay(); 
    }

    function quickSelect(code) { 
        inputCode = code; 
        updateCodeDisplay(); 
        queryStock(); 
    }

    function updateCodeDisplay() { 
        const codeDisp = document.getElementById('codeDisplay');
        if (inputCode === 't00') {
            codeDisp.innerText = "代號: 大盤(t00)";
        } else {
            codeDisp.innerText = inputCode ? `代號: ${inputCode}` : "請輸入代號"; 
        }
    }

    // 櫃買中心 (TPEx) 官方 OpenAPI 備援 (直連無須 Proxy)
    async function fetchTPExOpenAPI(stockNo) {
        try {
            const url = `https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes`;
            const res = await fetch(url);
            const data = await res.json();
            if (Array.isArray(data)) {
                const item = data.find(row => row.SecuritiesCompanyCode && row.SecuritiesCompanyCode.trim() === stockNo.trim());
                if (item) {
                    const price = parseFloat(item.Close);
                    const change = parseFloat(item.Change || 0);
                    return {
                        name: item.CompanyName ? item.CompanyName.trim() : stockNo,
                        price: isNaN(price) ? null : price,
                        change: isNaN(change) ? 0 : change
                    };
                }
            }
        } catch(e) {
            console.warn('TPEx OpenAPI 查詢失敗:', e);
        }
        return null;
    }

    // 主查詢邏輯
    async function queryStock() {
        if (!inputCode) return;
        
        isNewInput = true;

        const priceDisp = document.getElementById('priceDisplay');
        const nameDisp = document.getElementById('nameDisplay');
        const timeDisp = document.getElementById('timeDisplay');
        
        nameDisp.className = "stock-name text-placeholder";
        nameDisp.innerText = "-";
        priceDisp.className = "stock-price";
        priceDisp.innerText = "連線查詢中...";
        timeDisp.className = "stock-time text-placeholder";
        timeDisp.innerText = "-";

        const code = inputCode.trim();

        try {
            const timeStamp = Date.now();
            // 精準格式: 上市 tse_${code}.tw | 上櫃 otc_${code}.tw
            const twseTarget = `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_${code}.tw|otc_${code}.tw&_=${timeStamp}`;
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(twseTarget)}`;
            
            const res = await fetch(proxyUrl);
            const data = await res.json();
            
            let stock = null;
            if (data && data.msgArray && data.msgArray.length > 0) {
                // 優先找尋有價格資訊的物件
                stock = data.msgArray.find(s => (s.z && s.z !== "-") || (s.a && s.a !== "-") || (s.y && s.y !== "-")) || data.msgArray[0];
            }

            if (stock && (stock.n || stock.z || stock.y)) {
                const name = code === 't00' ? '加權指數' : (stock.n || code);
                const yClose = parseFloat(stock.y || 0);
                
                let priceStr = stock.z;
                if (!priceStr || priceStr === "-") {
                    priceStr = stock.a ? stock.a.split('_')[0] : (stock.b ? stock.b.split('_')[0] : "-");
                }

                // 即時 API 盤後未提供或無資料時，自動觸發櫃買官方 OpenAPI 備援
                if (!priceStr || priceStr === "-") {
                    const fallback = await fetchTPExOpenAPI(code);
                    if (fallback && fallback.price !== null) {
                        nameDisp.innerText = `${fallback.name} (${code})`;
                        nameDisp.className = "stock-name";
                        priceDisp.innerText = `$${fallback.price.toFixed(2)}`;
                        priceDisp.className = "stock-price";
                        timeDisp.innerText = "櫃買中心每日收盤價";
                        timeDisp.className = "stock-time";
                        return;
                    }

                    nameDisp.innerText = `${name} (${code})`;
                    nameDisp.className = "stock-name";
                    priceDisp.innerText = "未開盤";
                    priceDisp.className = "stock-price";
                    timeDisp.innerText = "-";
                    timeDisp.className = "stock-time text-placeholder";
                    return;
                }

                const price = parseFloat(priceStr);
                const change = price - yClose;
                const changePct = yClose > 0 ? ((change / yClose) * 100).toFixed(2) : "0.00";
                const sign = change > 0 ? "+" : "";

                nameDisp.innerText = `${name} (${code})`;
                nameDisp.className = "stock-name";
                
                priceDisp.innerText = `$${price.toFixed(2)} (${sign}${changePct}%)`;
                priceDisp.className = `stock-price ${change > 0 ? 'up' : (change < 0 ? 'down' : '')}`;
                
                const now = new Date();
                const day = now.getDay();
                const timeNum = now.getHours() * 100 + now.getMinutes();
                const isTradingHours = (day >= 1 && day <= 5) && (timeNum >= 900 && timeNum <= 1330);
                const updateTime = stock.t || now.toLocaleTimeString();
                
                timeDisp.innerText = isTradingHours ? `盤中即時報價 (${updateTime})` : `盤後報價 (${updateTime})`;
                timeDisp.className = "stock-time";
                return;
            }

            // 若 MIS API 完全查無資料，執行最後開放資料備援
            const fallback = await fetchTPExOpenAPI(code);
            if (fallback && fallback.price !== null) {
                nameDisp.innerText = `${fallback.name} (${code})`;
                nameDisp.className = "stock-name";
                priceDisp.innerText = `$${fallback.price.toFixed(2)}`;
                priceDisp.className = "stock-price";
                timeDisp.innerText = "櫃買中心每日收盤價";
                timeDisp.className = "stock-time";
                return;
            }

            nameDisp.innerText = "查無此股票代號";
            nameDisp.className = "stock-name";
            priceDisp.innerText = "無資料";
            priceDisp.className = "stock-price";
            timeDisp.innerText = "-";
            timeDisp.className = "stock-time text-placeholder";

        } catch (e) {
            console.error(e);
            const fallback = await fetchTPExOpenAPI(code);
            if (fallback && fallback.price !== null) {
                nameDisp.innerText = `${fallback.name} (${code})`;
                nameDisp.className = "stock-name";
                priceDisp.innerText = `$${fallback.price.toFixed(2)}`;
                priceDisp.className = "stock-price";
                timeDisp.innerText = "櫃買中心每日收盤價";
                timeDisp.className = "stock-time";
                return;
            }

            nameDisp.innerText = "-";
            nameDisp.className = "stock-name text-placeholder";
            priceDisp.innerText = "查詢失敗";
            priceDisp.className = "stock-price";
            timeDisp.innerText = "-";
            timeDisp.className = "stock-time text-placeholder";
        }
    }

    // 註冊 Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW 註冊成功'))
                .catch(err => console.log('SW 註冊失敗', err));
        });
    }
</script>
</body>
</html>
